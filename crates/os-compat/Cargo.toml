[package]
name = "os-compat"
version = "0.1.0"
edition = "2021"
description = "Windows stand-ins for the few std::os::unix APIs openOrchestra uses (exploratory Windows port)"
license = "GPL-3.0-or-later"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Power", "Win32_System_Registry"] }
