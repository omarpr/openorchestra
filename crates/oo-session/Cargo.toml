[package]
name = "oo-session"
version = "0.1.0"
edition = "2021"
description = "Windows stand-in for tmux: detached ConPTY sessions that outlive their terminal tab (exploratory Windows port)"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "oo-session"
path = "src/main.rs"

# The phone remote's tmux bridge, run against this binary (tests/remote_bridge.rs).
[target.'cfg(windows)'.dev-dependencies]
oo-remote = { path = "../remote" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
vt100 = "0.16"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
