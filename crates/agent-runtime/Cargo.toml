[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2021"
description = "Agent-agnostic runtime adapters: one AgentRuntime per vendor CLI, normalizing optional 'needs input' signals onto one bus (architecture §4.5-4.6)"

[dependencies]
# Format-preserving TOML editing for codex's config.toml — line-based
# appends land inside whatever [table] ends the file, which corrupted a
# user's mcp_servers config.
toml_edit = "0.22"
worktrees = { path = "../worktrees" }
status-watch = { path = "../status-watch" }
agent-schema = { path = "../agent-schema" }
crossbeam-channel = "0.5"
serde_json = "1"

[dev-dependencies]
toml = "0.8"
tempfile = "3"
serde_json = "1"

