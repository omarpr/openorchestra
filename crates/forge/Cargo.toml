[package]
name = "forge"
version = "0.1.0"
edition = "2021"
description = "PR + CI status via the gh CLI behind a Forge trait (architecture §6.3, Spike 2)"
# Headless: no zed dependency. GPL to match the app it ships in.
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"

[dev-dependencies]
crossbeam-channel = "0.5"
