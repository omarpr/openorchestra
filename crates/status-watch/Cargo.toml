[package]
name = "status-watch"
version = "0.1.0"
edition = "2021"
description = "Watches worktree .harness/status.json files and delivers agent status updates (architecture §4.1, Spike 2)"
# Headless: no zed dependency. GPL to match the app it ships in.
license = "GPL-3.0-or-later"

[dependencies]
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3"
crossbeam-channel = "0.5"
