[package]
name = "oo-remote"
version = "0.1.0"
edition = "2021"
description = "LAN remote control for openOrchestra agent tabs (remote.json store, pairing, server)"
# Headless: no zed dependency. GPL to match the app it ships in.
license = "GPL-3.0-or-later"

[lib]
name = "oo_remote"

[dependencies]
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
libc = "0.2"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
