[package]
name = "oo-remote"
version = "0.1.0"
edition = "2021"
description = "LAN remote control for openOrchestra agent tabs (remote.json store, pairing, server)"
# Headless: no zed dependency. GPL to match the app it ships in.
license = "GPL-3.0-or-later"

[lib]
name = "oo_remote"

[dependencies]
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
libc = "0.2"
getrandom = "0.4"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
if-addrs = "0.15.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
base64 = "0.22"
sha2 = "0.10"
x509-parser = "0.18.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
bytes = "1"

[dev-dependencies]
plist = "1.10.3"
tempfile = "3"
