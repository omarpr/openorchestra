[package]
name = "oo-remote"
version = "0.2.0"
edition = "2021"
description = "LAN remote control for openOrchestra agent tabs (remote.json store, pairing, server)"
# Headless: no zed dependency. GPL to match the app it ships in.
license = "GPL-3.0-or-later"

[lib]
name = "oo_remote"

[dependencies]
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
libc = "0.2"
getrandom = "0.4"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
if-addrs = "0.15.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
base64 = "0.22"
sha2 = "0.10"
x509-parser = "0.18.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
bytes = "1"
axum = { version = "0.8.9", default-features = false, features = ["ws", "http1", "tokio", "json"] }
axum-server = { version = "0.9.2", features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rust-embed = { version = "8.11", features = ["debug-embed"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zstd = "0.13"
tempfile = "3"

[dev-dependencies]
plist = "1.10.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-manual-roots", "json", "stream"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
