[package]
name = "pi-client"
version = "0.1.0"
edition = "2021"
description = "Typed client for pi's RPC mode: JSONL framing, protocol types, and state derivation (architecture §4.2-4.3)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3"
