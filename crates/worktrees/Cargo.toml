[package]
name = "worktrees"
version = "0.1.0"
edition = "2021"
description = "Git worktree manager + on-disk registry (architecture §6.1, Spike 4)"
# Headless: no zed dependency. GPL to match the app it ships in.
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"
