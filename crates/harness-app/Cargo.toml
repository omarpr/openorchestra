# harness-app — Spike 1: GPUI shell + embedded terminal running pi's TUI.
#
# This package is DELIBERATELY standalone (empty [workspace] below) and excluded
# from the repo root workspace: it carries the zed git dependency cone with its
# own Cargo.lock, so the headless crates (worktrees, forge, status-watch) keep a
# fast, small build graph.
#
# Zed pin: tag v1.11.3 = commit 952d712dac48a4af2c54fb22c82d82a9d69b72d4
# (latest stable release tag at time of writing). Upgrade deliberately; keep all
# zed crates on the same rev (§3.1 of docs/architecture.md).

[package]
name = "harness-app"
version = "0.1.0"
edition = "2024"
publish = false
# GPL because we link zed's `terminal` crate (GPL-3.0-or-later). Accepted in
# docs/architecture.md §3.2. gpui itself is Apache-2.0.
license = "GPL-3.0-or-later"

[workspace]
# Intentionally empty: makes this package its own workspace root so cargo does
# not try to attach it to the repo root workspace.

[dependencies]
crossbeam-channel = "0.5"
# Live diff-watcher (diff_watch.rs). The [patch.crates-io] below redirects this
# to zed's notify fork, the same one status-watch resolves.
notify = "8"
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# Platform entry point (Application constructor) — new split at v1.11.x; the
# features mirror what zed's own gpui examples enable.
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4", features = ["font-kit", "wayland", "x11"] }
# Zed's terminal model crate (pty + alacritty state machine). GPL-3.0-or-later.
terminal = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# Required globals for `terminal`:
settings = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
theme = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
theme_settings = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
release_channel = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
task = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
util = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }

# The editor cone (§8 R1 — retired by Spike 3). `language` gives us the
# LanguageRegistry the hosted Workspace's Project uses; we register exactly one
# grammar (tree-sitter-rust) into it rather than pulling zed's eighteen (§3.2).
editor = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
language = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# Language configs + highlight queries as embedded assets. Small and data-only:
# depending on it does NOT pull the eighteen native grammars (that is the
# languages crate's load-grammars feature, which stays off — §3.2).
grammars = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# zed's embedded asset tree (SVG icons, fonts). Without an asset source every
# ui::Icon inside the hosted workspace — file-type icons, chevrons, search bar
# buttons — silently draws nothing.
assets = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
tree-sitter-rust = "0.24.2"
# The rest of the curated grammar set (§3.2 revised: a curated set, not one,
# not eighteen). Versions pinned to zed's own Cargo.lock so the queries in the
# grammars crate compile against the node types these grammars produce.
tree-sitter-language = "0.1"
# typescript + yaml come from zed's forks (same revs as zed's Cargo.toml):
# upstream typescript lacks a fix zed's queries rely on, and upstream yaml
# still exports the pre-LanguageFn binding shape.
tree-sitter-typescript = { git = "https://github.com/zed-industries/tree-sitter-typescript", rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899" }
tree-sitter-yaml = { git = "https://github.com/zed-industries/tree-sitter-yaml", rev = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a" }
tree-sitter-go = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-python = "=0.25.0"
tree-sitter-css = "=0.23.2"
tree-sitter-bash = "=0.25.1"

# Spike 4: the headless worktree manager + registry (git worktree lifecycle,
# status, merge-base diff). Path dep — light (serde only), no zed cone.
worktrees = { path = "../worktrees" }
# Live sidebar data: forge poller (PR/CI badges via `gh`) + status watcher
# (agent pill via .harness/status.json). Path deps; degrade gracefully when gh
# or pi are absent.
forge = { path = "../forge" }
status-watch = { path = "../status-watch" }
# The agent-agnostic layer (§4.5-4.6): picks the CLI per worktree, drops in the
# per-agent config, and normalizes every adapter's signal onto one bus.
agent-runtime = { path = "../agent-runtime" }
# Localhost A2A broker for multi-member task orchestration.
a2a-broker = { path = "../a2a-broker" }
# M8: the Phase 2 chat tab drives a `pi --mode rpc` sidecar through this.
pi-client = { path = "../pi-client" }

# Proper terminal view (pty sizing, input, IME, scrollback, selection) replacing
# the custom renderer. workspace + project are already compiled transitively by
# `editor`; terminal_view references them via weak handles (no real Workspace).
terminal_view = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
workspace = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
project = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }

# Spike 5 (§3.6, R10): hosting a real zed Workspace inside our own chrome.
# These are the pieces AppState/Workspace::new need constructed directly, plus
# the navigation crates the N-track hangs off.
fs = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
client = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
clock = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
http_client = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
node_runtime = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# `test-support` only to reach `Session::test()` — see workspace_host.rs for
# why a fresh, history-less session is the semantically correct choice here.
session = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4", features = ["test-support"] }
project_panel = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
file_finder = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
search = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# project_panel's actions live here, not in the panel crate itself.
zed_actions = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# For menu::Cancel — escape must close pickers (file finder) or ⌘P traps you.
menu = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# The channel type NodeRuntime's options arrive on (zed's own watch crate).
watch = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# For git::Blame — the gutter-blame toggle action lives in the git crate.
git = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# Rendered .md preview in the diff panel — zed's own renderer, so previews
# match the editor rather than a hand-rolled approximation.
markdown = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# Native git/diff INSIDE the editor: project-diff view, git panel, and editor
# gutter change-bars. Additive to our custom review panel. Auto-attaches to the
# hosted Workspace via git_ui::init's observe_new hook. Already compiled
# transitively, so declaring it just makes it nameable.
git_ui = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# Only for `language_model::init` — the git panel's constructor reads the
# LanguageModelRegistry global and `App::global` panics when it is unset, so
# the panel cannot dock without it. init installs an empty registry and nothing
# more; zed's `language_models` crate (the actual providers) stays out of the
# cone. Already compiled transitively via git_ui, so declaring it costs nothing.
language_model = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# Native, live, code-highlighted Markdown preview as an editor pane item —
# distinct from the diff-panel disk-content preview above.
markdown_preview = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# zed's component library (IconButton, IconName, Tooltip). Needed because the
# Markdown preview "eye" button is NOT reusable: zed keeps it in its *binary*
# crate (zed/src/zed/quick_action_bar/preview.rs), so we rebuild it against the
# public API instead of depending on it. Already compiled transitively (editor
# and workspace both use it), so declaring it just makes it nameable.
ui = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }
# Zed's breadcrumb trail (file path › enclosing symbol) as a PrimaryLeft toolbar
# item. Not cosmetic: `Toolbar::render` right-aligns the PrimaryRight group with
# `justify_between`, which only pushes right when a LEFT item exists. With none,
# the group collapses to the left edge and takes the Markdown preview eye with
# it — zed always installs this item in its own pane init, and we did not.
breadcrumbs = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4" }

# N2 (§12): rust-analyzer needs the language *adapters*, which live here.
# Deliberately WITHOUT default features so `load-grammars` stays off — §3.2's
# one-grammar discipline holds, and we keep bringing tree-sitter-rust
# ourselves rather than compiling eighteen grammars for an editor that shows
# Rust.
languages = { git = "https://github.com/zed-industries/zed.git", rev = "952d712dac48a4af2c54fb22c82d82a9d69b72d4", default-features = false }

anyhow = "1"
semver = "1"
log = "0.4"
env_logger = "0.11"
# Spike 3c: build a zed ThemeFamilyContent from HarnessTheme tokens via a JSON
# value (every content field is Option/#[serde(default)], so a partial object
# deserializes cleanly). serde_json is already deep in the zed cone.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# kill(pid, 0) liveness probe — unsticks an agent pill left on waiting/running
# by a process that died without writing "idle".
libc = "0.2"
# Per-process CPU/RSS sampling for the sidebar resource band. 0.37.2 is already
# resolved in this lockfile via the zed cone, so pinning here adds no new copy.
sysinfo = "0.37"
# Shell-quoting for paths dropped onto a terminal pane. Same version zed's own
# `terminal_view` pins, so a dropped path is quoted here exactly as zed would
# quote it — the format users already expect from every other terminal.
shlex = "1.3.0"

# Zed's workspace [patch.crates-io] entries do NOT propagate to out-of-tree
# consumers, so we replicate the ones inside our dependency cone (from zed's
# root Cargo.toml at the pinned rev). calloop is pinned to the rev zed's own
# Cargo.lock resolved at v1.11.3. windows-capture (via zed-scap) only
# compiles on Windows, so it is untested here — replicated for lock fidelity.
[dev-dependencies]
tempfile = "3"

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "eb6b4fd17b9af5ecc226546bdd04185391b3e265" }
notify = { git = "https://github.com/zed-industries/notify", rev = "faecbc33db4f59313e5225ef766bfd9e54a54cfd" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "faecbc33db4f59313e5225ef766bfd9e54a54cfd" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }

[profile.dev]
# Keep target/ small (the zed cone is huge). Bump to "limited" locally if you
# need backtraces with symbols.
debug = 0
incremental = false

[profile.release]
debug = 0

# Native macOS notifications with action buttons (UNUserNotificationCenter).
# osascript can neither add buttons nor carry a response back; these bindings
# can. Only a real bundle may use the framework — the dev binary falls back
# to osascript.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

# zed's own dev profile carries these same four overrides, and they are
# load-bearing, not a speed nicety: zed's `with_parser` attaches a
# `WasmStore` to every parser it creates, and the store's construction
# compiles tree-sitter's wasm stdlib with cranelift ON FIRST PARSE — on a
# gpui background (GCD) thread with a 512KB stack. Cranelift's egraph
# optimizer recurses deeply; at opt-level 0 its frames are large enough to
# blow that stack, so a debug build without these lines crashes (SIGILL,
# stack-probe guard) the first time any buffer parses — i.e. the first
# time a file opens with a real grammar attached.
# `debug = 0` makes rustc strip debuginfo from every artifact, and on current
# macOS toolchains (ld-27034 / ld-27106) stripping the sqlez_macros proc-macro
# — it statically bundles SQLite — leaves a dylib dyld refuses to load
# ("mis-aligned LINKEDIT string pool"). rustc then reports the misleading
# `E0463: can't find crate for sqlez_macros` while compiling zed's `db`. A
# cached copy hides this until anything forces the macro to relink.
[profile.dev.package.sqlez_macros]
strip = false
[profile.release.package.sqlez_macros]
strip = false

[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
