# harness-app — Spike 1: GPUI shell + embedded terminal running pi's TUI.
#
# This package is DELIBERATELY standalone (empty [workspace] below) and excluded
# from the repo root workspace: it carries the zed git dependency cone with its
# own Cargo.lock, so the headless crates (worktrees, forge, status-watch) keep a
# fast, small build graph.
#
# Zed pin: tag v1.28.1 = commit e8bc16acee5ae1937600d571d441c4b5d7b0d288
# (latest stable release tag at time of writing). Upgrade deliberately; keep all
# zed crates on the same rev (§3.1 of docs/architecture.md).

[package]
name = "harness-app"
version = "1.3.0"
edition = "2024"
publish = false
# GPL because we link zed's `terminal` crate (GPL-3.0-or-later). Accepted in
# docs/architecture.md §3.2. gpui itself is Apache-2.0.
license = "GPL-3.0-or-later"

[workspace]
# Intentionally empty: makes this package its own workspace root so cargo does
# not try to attach it to the repo root workspace.

[dependencies]
crossbeam-channel = "0.5"
# The browser tab's web view callbacks → gpui bridge (an unbounded channel the
# pane awaits). Already in the lockfile through gpui; was dev-only.
futures = "0.3"
# Live diff-watcher (diff_watch.rs). The [patch.crates-io] below redirects this
# to zed's notify fork, the same one status-watch resolves.
notify = "8"
url = "2.5"
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# Platform entry point (Application constructor) — new split at v1.11.x; the
# features mirror what zed's own gpui examples enable.
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288", features = ["font-kit", "wayland", "x11"] }
# Zed's terminal model crate (pty + alacritty state machine). GPL-3.0-or-later.
terminal = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# Required globals for `terminal`:
settings = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
theme = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
theme_settings = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
release_channel = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# `debug-embed`: since v1.2x zed's debug builds read their embedded assets
# (default settings, keymaps, icons, grammars' queries) from "the checkout that
# built this binary", found by walking up to the first `.git`. For us that is
# the openOrchestra repo, which has no zed `assets/`, so a debug build panicked
# at startup on `settings/default.json`. Embedding at compile time, as release
# builds always do, makes `make run` self-contained again.
util = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288", features = ["debug-embed"] }

# The editor cone (§8 R1 — retired by Spike 3). `language` gives us the
# LanguageRegistry the hosted Workspace's Project uses; we register exactly one
# grammar (tree-sitter-rust) into it rather than pulling zed's eighteen (§3.2).
editor = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
language = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# Language configs + highlight queries as embedded assets. Small and data-only:
# depending on it does NOT pull the eighteen native grammars (that is the
# languages crate's load-grammars feature, which stays off — §3.2).
grammars = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# zed's embedded asset tree (SVG icons, fonts). Without an asset source every
# ui::Icon inside the hosted workspace — file-type icons, chevrons, search bar
# buttons — silently draws nothing.
assets = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
tree-sitter-rust = "0.24.2"
# The rest of the curated grammar set (§3.2 revised: a curated set, not one,
# not eighteen). Versions pinned to zed's own Cargo.lock so the queries in the
# grammars crate compile against the node types these grammars produce.
tree-sitter-language = "0.1"
# typescript + yaml come from zed's forks (same revs as zed's Cargo.toml):
# upstream typescript lacks a fix zed's queries rely on, and upstream yaml
# still exports the pre-LanguageFn binding shape.
tree-sitter-typescript = { git = "https://github.com/zed-industries/tree-sitter-typescript", rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899" }
tree-sitter-yaml = { git = "https://github.com/zed-industries/tree-sitter-yaml", rev = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a" }
# zed v1.27 moved go to its own fork (same rev as zed's Cargo.toml).
tree-sitter-go = { git = "https://github.com/zed-industries/tree-sitter-go", rev = "6862a49e3c5a7567a6c576420e9a8f944e198a85" }
tree-sitter-json = "=0.24.8"
tree-sitter-python = "=0.25.0"
tree-sitter-css = "=0.23.2"
tree-sitter-bash = "=0.25.1"
# The rest of zed's built-in configs (grammars crate), at the revs and exact
# versions zed's own Cargo.toml/Cargo.lock use. markdown is zed's fork (a
# serialize() buffer-overflow fix); cpp, gitcommit, gomod and gowork are
# pinned to git revs exactly as zed pins them.
tree-sitter-md = { git = "https://github.com/zed-industries/tree-sitter-markdown", rev = "b596e737286780d7bfa9fcddceaeeb754574b352" }
tree-sitter-c = "=0.24.1"
tree-sitter-cpp = { git = "https://github.com/tree-sitter/tree-sitter-cpp", rev = "5cb9b693cfd7bfacab1d9ff4acac1a4150700609" }
tree-sitter-diff = "=0.1.0"
tree-sitter-gitcommit = { git = "https://github.com/zed-industries/tree-sitter-git-commit", rev = "88309716a69dd13ab83443721ba6e0b491d37ee9" }
tree-sitter-go-mod = { git = "https://github.com/camdencheek/tree-sitter-go-mod", rev = "2e886870578eeba1927a2dc4bd2e2b3f598c5f9a", package = "tree-sitter-gomod" }
tree-sitter-gowork = { git = "https://github.com/zed-industries/tree-sitter-go-work", rev = "acb0617bf7f4fda02c6217676cc64acb89536dc7" }
tree-sitter-jsdoc = "=0.23.2"
tree-sitter-regex = "=0.24.3"

# Spike 4: the headless worktree manager + registry (git worktree lifecycle,
# status, merge-base diff). Path dep — light (serde only), no zed cone.
worktrees = { path = "../worktrees" }
# Live sidebar data: forge poller (PR/CI badges via `gh`). Path dep; degrades
# gracefully when gh is absent. (The agent pill's status watcher arrives
# through agent-runtime.)
forge = { path = "../forge" }
# The agent-agnostic layer (§4.5-4.6): picks the CLI per worktree, drops in the
# per-agent config, and normalizes every adapter's signal onto one bus.
agent-runtime = { path = "../agent-runtime" }
# Localhost A2A broker for multi-member task orchestration.
a2a-broker = { path = "../a2a-broker" }
# M8: the Phase 2 chat tab drives a `pi --mode rpc` sidecar through this.
pi-client = { path = "../pi-client" }
# oo-remote: phone-reachable HTTP/SSE server + embedded PWA for remote agent control.
oo-remote = { path = "../remote" }
# Name the snapshot channel type and format `status_since` (RFC 3339); both
# already in the graph through oo-remote.
tokio = { version = "1", features = ["sync"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

# Proper terminal view (pty sizing, input, IME, scrollback, selection) replacing
# the custom renderer. workspace + project are already compiled transitively by
# `editor`; terminal_view references them via weak handles (no real Workspace).
terminal_view = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
workspace = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
project = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }

# Spike 5 (§3.6, R10): hosting a real zed Workspace inside our own chrome.
# These are the pieces AppState/Workspace::new need constructed directly, plus
# the navigation crates the N-track hangs off.
fs = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
client = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
clock = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
http_client = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
node_runtime = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# `test-support` only to reach `Session::test()` — see workspace_host.rs for
# why a fresh, history-less session is the semantically correct choice here.
session = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288", features = ["test-support"] }
project_panel = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
file_finder = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
search = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# project_panel's actions live here, not in the panel crate itself.
zed_actions = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# For menu::Cancel — escape must close pickers (file finder) or ⌘P traps you.
menu = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# The channel type NodeRuntime's options arrive on (zed's own watch crate).
watch = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# For git::Blame — the gutter-blame toggle action lives in the git crate.
git = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# Rendered .md preview in the diff panel — zed's own renderer, so previews
# match the editor rather than a hand-rolled approximation.
markdown = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# Native git/diff INSIDE the editor: project-diff view, git panel, and editor
# gutter change-bars. Additive to our custom review panel. Auto-attaches to the
# hosted Workspace via git_ui::init's observe_new hook. Already compiled
# transitively, so declaring it just makes it nameable.
git_ui = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# Only for `language_model::init` — the git panel's constructor reads the
# LanguageModelRegistry global and `App::global` panics when it is unset, so
# the panel cannot dock without it. init installs an empty registry and nothing
# more; zed's `language_models` crate (the actual providers) stays out of the
# cone. Already compiled transitively via git_ui, so declaring it costs nothing.
language_model = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# Native, live, code-highlighted Markdown preview as an editor pane item —
# distinct from the diff-panel disk-content preview above.
markdown_preview = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# zed's component library (IconButton, IconName, Tooltip). Needed because the
# Markdown preview "eye" button is NOT reusable: zed keeps it in its *binary*
# crate (zed/src/zed/quick_action_bar/preview.rs), so we rebuild it against the
# public API instead of depending on it. Already compiled transitively (editor
# and workspace both use it), so declaring it just makes it nameable.
ui = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
# Zed's breadcrumb trail (file path › enclosing symbol) as a PrimaryLeft toolbar
# item. Not cosmetic: `Toolbar::render` right-aligns the PrimaryRight group with
# `justify_between`, which only pushes right when a LEFT item exists. With none,
# the group collapses to the left edge and takes the Markdown preview eye with
# it — zed always installs this item in its own pane init, and we did not.
breadcrumbs = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }

# N2 (§12): rust-analyzer needs the language *adapters*, which live here.
# Deliberately WITHOUT default features so `load-grammars` stays off — §3.2's
# one-grammar discipline holds, and we keep bringing tree-sitter-rust
# ourselves rather than compiling eighteen grammars for an editor that shows
# Rust.
languages = { git = "https://github.com/zed-industries/zed.git", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288", default-features = false }

anyhow = "1"
semver = "1"
log = "0.4"
env_logger = "0.11"
# Spike 3c: build a zed ThemeFamilyContent from HarnessTheme tokens via a JSON
# value (every content field is Option/#[serde(default)], so a partial object
# deserializes cleanly). serde_json is already deep in the zed cone.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# kill(pid, 0) liveness probe — unsticks an agent pill left on waiting/running
# by a process that died without writing "idle".
libc = "0.2"
# Per-process CPU/RSS sampling for the sidebar resource band. 0.37.2 is already
# resolved in this lockfile via the zed cone, so pinning here adds no new copy.
sysinfo = "0.37"
# Shell-quoting for paths dropped onto a terminal pane. Same version zed's own
# `terminal_view` pins, so a dropped path is quoted here exactly as zed would
# quote it — the format users already expect from every other terminal.
shlex = "1.3.0"
# The conductor's frames are handed to gpui as `image::Frame`s. Already in
# the lockfile via gpui, so this adds no new copy.
image = { version = "0.25", default-features = false }
# Settings → Remote draws the "Add a device" QR from its modules (as divs), so
# none of its image/svg renderers are needed.
qrcode = { version = "0.14.1", default-features = false }
tempfile = "3"

# Zed's workspace [patch.crates-io] entries do NOT propagate to out-of-tree
# consumers, so we replicate the ones inside our dependency cone (from zed's
# root Cargo.toml at the pinned rev). calloop and the rest follow the
# revs zed itself pins at v1.28.1. windows-capture (via zed-scap) only
# compiles on Windows, so it is untested here — replicated for lock fidelity.
[patch.crates-io]
# Mirrors zed's own [patch.crates-io] at the pinned rev (v1.28.1). Entries for
# crates outside our cone (cpal, crash-context) are left out, and zed's
# `scratch` patch is a path inside its repo, so it cannot be replicated.
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
notify = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "803c6ebaac27d69e1808b45058482e868d073ceb" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.dev]
# Keep target/ small (the zed cone is huge). Bump to "limited" locally if you
# need backtraces with symbols.
debug = 0
incremental = false

[profile.release]
debug = 0

# Native macOS notifications with action buttons (UNUserNotificationCenter).
# osascript can neither add buttons nor carry a response back; these bindings
# can. Only a real bundle may use the framework — the dev binary falls back
# to osascript.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"
# The browser tab's WKWebView (browser_pane/webview.rs). Same objc2 0.6 family
# as above; objc2-app-kit 0.3.2 and dispatch2 0.3.1 are already in the lockfile
# via gpui_macos, so this adds exactly one crate (objc2-web-kit). Chosen over
# wry: see the header of webview.rs.
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKFrameInfo",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKNavigationResponse",
    "WKUIDelegate",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
    "WKWindowFeatures",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    # The browser tab's key monitor (webview.rs): ⌘-chords over a page.
    "block2",
    "NSEvent",
    "NSMenu",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
# Posts web view callbacks back onto the main queue (see NativeEvents).
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
# gpui's Window hands out its NSView through HasWindowHandle.
raw-window-handle = "0.6"

# zed's own dev profile carries these same four overrides, and they are
# load-bearing, not a speed nicety: zed's `with_parser` attaches a
# `WasmStore` to every parser it creates, and the store's construction
# compiles tree-sitter's wasm stdlib with cranelift ON FIRST PARSE — on a
# gpui background (GCD) thread with a 512KB stack. Cranelift's egraph
# optimizer recurses deeply; at opt-level 0 its frames are large enough to
# blow that stack, so a debug build without these lines crashes (SIGILL,
# stack-probe guard) the first time any buffer parses — i.e. the first
# time a file opens with a real grammar attached.
# `debug = 0` makes rustc strip debuginfo from every artifact, and on current
# macOS toolchains (ld-27034 / ld-27106) stripping the sqlez_macros proc-macro
# — it statically bundles SQLite — leaves a dylib dyld refuses to load
# ("mis-aligned LINKEDIT string pool"). rustc then reports the misleading
# `E0463: can't find crate for sqlez_macros` while compiling zed's `db`. A
# cached copy hides this until anything forces the macro to relink.
[profile.dev.package.sqlez_macros]
strip = false
[profile.release.package.sqlez_macros]
strip = false

[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
