# cargo-audit policy for harness-app's standalone lockfile (the zed dependency
# cone). Deliberately scoped: cargo-audit reads `.cargo/audit.toml` relative to
# its working directory and has no `--config` flag, so keeping this file inside
# `crates/harness-app/` means it can only ever apply to this package's audit.
# The repo-root workspace audit has no ignore file and stays strict — that graph
# is ours (66 crates, currently clean) and should never need an exception.
#
# Every entry below is transitive through the zed pin; none is a direct
# dependency of ours, and none has a fixed upgrade reachable from here (the
# quick-xml fix is >=0.41.0, and the three live versions are semver-incompatible
# 0.x releases chosen by zed's workspace and two upstream crates, so
# `cargo update` cannot cross them; `rsa` has no fixed release at all).
#
# VALID ONLY FOR zed rev 952d712dac48a4af2c54fb22c82d82a9d69b72d4 (tag v1.11.3).
# A pin bump rewrites Cargo.lock, which re-triggers the workflow — re-verify the
# reachability notes below at that point rather than carrying them forward
# blindly. Advisories NOT listed here still fail the job.

[advisories]
ignore = [
  # RUSTSEC-2026-0194 — quick-xml: quadratic run time checking a start tag for
  # duplicate attribute names. Three versions are in the graph:
  #   0.30.0  via gpui -> zed-scap -> xcb. A [build-dependencies] entry
  #           (xcb-1.7.0/Cargo.toml:280) driving build-time codegen over the
  #           X11 protocol XML bundled in the crate. Not runtime-reachable.
  #   0.39.4  via gpui_platform -> gpui_linux -> wayland-client ->
  #           wayland-scanner. Build-time protocol-XML codegen, Linux-only.
  #           Not runtime-reachable.
  #   0.38.4  via markdown -> mermaid_render. This one IS live at runtime: it
  #           post-processes the SVG that mermaid emits for our markdown
  #           preview (src/markdown_preview.rs). Worst case is a crafted
  #           mermaid diagram in an already-opened repo burning CPU in the
  #           preview pane — local DoS, no RCE and no disclosure. Accepted
  #           until zed bumps quick-xml.
  "RUSTSEC-2026-0194",

  # RUSTSEC-2026-0195 — quick-xml: unbounded namespace-declaration allocation
  # in `NsReader`. Same three paths, but advisory-specific: the two Linux/X11
  # paths are build-time as above, and mermaid_render uses `quick_xml::Reader`
  # exclusively (no `NsReader` reference anywhere in that crate), so the
  # runtime path is not affected by this one at all.
  "RUSTSEC-2026-0195",

  # RUSTSEC-2023-0071 — rsa: Marvin attack, potential key recovery via timing
  # sidechannels. No fixed upgrade exists. Reached via client -> rpc, i.e.
  # zed's collab handshake. We construct `client::Client` on top of
  # `http_client::BlockedHttpClient` (workspace_host.rs:72) precisely to keep
  # zed's collab and telemetry paths inert, so the RSA decryption is never
  # executed and there is no timing oracle to measure. If a real HTTP client
  # is ever wired in, this exception must be revisited first.
  "RUSTSEC-2023-0071",
]
