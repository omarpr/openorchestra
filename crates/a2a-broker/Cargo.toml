[package]
name = "a2a-broker"
version = "0.1.0"
edition = "2021"
description = "Localhost A2A v1.0 broker: Agent Cards + JSON-RPC facades over openOrchestra task members"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3"
