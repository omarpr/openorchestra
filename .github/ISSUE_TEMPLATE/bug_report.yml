name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security issues go through a private advisory instead, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a task on a repo with …
        2. Start Claude Code in it
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: openOrchestra version
      description: "In Finder, select openOrchestra.app and choose Get Info (e.g. 1.0.0), or run: brew info --cask openorchestra"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.2, Apple M3
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent involved
      multiple: true
      options: [None, Claude Code, Codex, OpenCode, pi, Kimi, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove anything private (code, paths, tokens) first.
