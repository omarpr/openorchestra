name: Security audit

on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      # Editing the documented advisory exceptions should re-run the audit.
      - "**/.cargo/audit.toml"
      - "web/remote/package.json"
      - "web/remote/pnpm-lock.yaml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/.cargo/audit.toml"
      - "web/remote/package.json"
      - "web/remote/pnpm-lock.yaml"
  schedule:
    # Weekly, so new RustSec advisories are caught without a code change.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Two lockfiles: the headless workspace, and harness-app which is a
      # standalone package (zed git-dependency cone).
      #
      # Strict: no ignore file at the repo root, so any advisory here fails.
      # This graph is ours and small, so it should stay exception-free.
      - name: Audit workspace lockfile
        run: cargo audit --file Cargo.lock
      # Run from the package directory so cargo-audit picks up
      # crates/harness-app/.cargo/audit.toml, which carries the documented
      # exceptions for the zed cone (cargo-audit resolves that file relative to
      # its working directory and has no --config flag). Advisories outside
      # that ignore list still fail the job.
      - name: Audit harness-app lockfile
        working-directory: crates/harness-app
        run: cargo audit --file Cargo.lock

  # The phone client (web/remote) is embedded in the app, so its runtime
  # dependencies ship to users. Gate on those only (`--prod`): the dev tooling
  # (vite, vitest, workbox) never ships, and some of its transitive advisories
  # have no patched release, which would keep a full audit permanently red.
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit phone client runtime dependencies
        working-directory: web/remote
        # Reads pnpm-lock.yaml; no install needed. Same pnpm as packageManager.
        run: npx --yes pnpm@12.21.0 audit --prod
