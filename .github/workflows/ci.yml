name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The headless crates (worktrees, forge, agent-runtime, a2a-broker, …):
  # the repo-root workspace. Fast, and portable, so Linux is enough.
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # harness-app is its own Cargo workspace (it carries the zed dependency
  # cone), so building the repo root silently skips it — it needs its own job.
  # macOS, because that is the platform it ships on and the one its
  # gpui/Metal paths are written for.
  app:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: crates/harness-app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/harness-app
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # Windows, on the documented toolchain: rustup's GNU host plus a MinGW GCC
  # (the runner image ships one in C:\mingw64), not the runner's MSVC default.
  # Without these jobs nothing under #[cfg(windows)] is ever compiled in CI.
  headless-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (GNU host)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal -c clippy
          rustup default stable-x86_64-pc-windows-gnu
          "C:\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Toolchain versions
        run: |
          rustc -vV
          gcc --version
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the build cached while these jobs are still red.
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        # Every failure in one run, not just the first crate's.
        run: cargo test --no-fail-fast

  app-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: crates/harness-app
    env:
      # Several git dependencies fetch more reliably through the git CLI
      # (as script/windows/make.ps1 sets).
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Git Bash, as the app sets SHELL at startup on Windows (platform.rs);
      # tests that build agent command lines read it.
      SHELL: C:\Program Files\Git\bin\bash.exe
    steps:
      - uses: actions/checkout@v4
      - name: Rust (GNU host)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal -c clippy
          rustup default stable-x86_64-pc-windows-gnu
          "C:\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/harness-app
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        # Every failure in one run, not just the first crate's.
        run: cargo test --no-fail-fast

  pi-ext:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-ext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
