name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The headless crates (worktrees, forge, agent-runtime, a2a-broker, …):
  # the repo-root workspace. Fast, and portable, so Linux is enough.
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # harness-app is its own Cargo workspace (it carries the zed dependency
  # cone), so building the repo root silently skips it — it needs its own job.
  # macOS, because that is the platform it ships on and the one its
  # gpui/Metal paths are written for.
  app:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: crates/harness-app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/harness-app
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  pi-ext:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-ext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
